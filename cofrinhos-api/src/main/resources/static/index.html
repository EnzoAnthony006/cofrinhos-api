<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Cofrinhos</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f9d63'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/acoes.css">
</head>
<body>

<header class="topbar" id="barra-topo" hidden>
    <div class="container topbar__inner">
        <div class="brand">
            <span class="brand__mark">C</span>
            <span class="brand__name">Cofrinhos</span>
        </div>
        <nav class="tabs" aria-label="Seções">
            <button class="tab" data-tela="dashboard">Dashboard</button>
            <button class="tab" data-tela="cofrinhos">Meus cofrinhos</button>
            <button class="tab" data-tela="ranking">Ranking</button>
        </nav>
        <div class="user">
            <span class="user__name" id="usuario-nome"></span>
            <button class="btn btn--ghost" id="btn-logout">Sair</button>
        </div>
    </div>
</header>

<section class="hero" id="tela-login" hidden>
    <div class="hero__card">
        <span class="brand__mark brand__mark--lg">C</span>
        <h1 class="hero__title">Cofrinhos</h1>
        <p class="hero__subtitle">
            Guarde dinheiro por objetivo, ganhe XP, mantenha sua sequência de aportes e suba no ranking.
        </p>
        <div class="hero__chips">
            <span class="chip">Metas</span>
            <span class="chip">XP e conquistas</span>
            <span class="chip">Ranking ao vivo</span>
        </div>
        <button class="btn btn--primary btn--lg" id="btn-login">Entrar</button>
        <p class="notice" id="aviso-login" role="alert" hidden></p>
    </div>
</section>

<main class="container" id="conteudo" hidden>

    <section class="tela" id="tela-dashboard" hidden>
        <div class="tela__header">
            <h1>Dashboard</h1>
        </div>
        <div id="conteudo-dashboard"></div>
    </section>

    <section class="tela" id="tela-cofrinhos" hidden>
        <div class="tela__header">
            <h1>Meus cofrinhos</h1>
            <button class="btn btn--primary" id="btn-novo-cofrinho">Novo cofrinho</button>
        </div>

        <form class="card form-novo" id="form-novo-cofrinho" hidden>
            <h2 class="secao-titulo">Novo cofrinho</h2>
            <div class="field">
                <label for="campo-nome">Nome</label>
                <input class="input" id="campo-nome" name="nome" maxlength="80" required>
            </div>
            <div class="field">
                <label for="campo-descricao">Descrição (opcional)</label>
                <textarea class="input" id="campo-descricao" name="descricao" rows="2" maxlength="200"></textarea>
            </div>
            <div class="form-linha">
                <div class="field">
                    <label for="campo-categoria">Categoria</label>
                    <select class="input" id="campo-categoria" name="categoria" required></select>
                </div>
                <div class="field">
                    <label for="campo-meta">Meta (R$)</label>
                    <input class="input" id="campo-meta" name="valorMeta" type="number"
                           min="0.01" step="0.01" inputmode="decimal" required>
                </div>
            </div>
            <div class="form-acoes">
                <button type="button" class="btn btn--ghost" id="btn-cancelar-cofrinho">Cancelar</button>
                <button type="submit" class="btn btn--primary" id="btn-salvar-cofrinho">Criar cofrinho</button>
            </div>
        </form>

        <div class="grid" id="lista-cofrinhos"></div>
    </section>

    <section class="tela" id="tela-ranking" hidden>
        <div class="tela__header">
            <h1>Ranking</h1>
            <button class="btn btn--ghost" id="btn-atualizar-ranking">Atualizar</button>
        </div>
        <div id="lista-ranking"></div>
    </section>

</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
