spring:
  application:
    name: cofrinhos-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cofrinhos
    username: cofrinhos
    password: cofrinhos

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: cofrinhos-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.enzoanthonydev.cofrinhos.cofrinhos_api.application.aporte

  data:
    redis:
      spring:
        data:
          redis:
            host: localhost
            port: 6379
            repositories:
              enabled: false
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080